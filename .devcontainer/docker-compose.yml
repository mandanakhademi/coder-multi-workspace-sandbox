services:
  backend:
    image: mcr.microsoft.com/devcontainers/python:3.11
    working_dir: /workspace/backend
    volumes:
      // === FIX: Mount the whole project root, mapping it to /workspace ===
      - /home/coder:/workspace
    ports:
      - "8000:8000"
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: mcr.microsoft.com/devcontainers/javascript-node:18
    working_dir: /workspace/frontend
    volumes:
      // === FIX: Mount the whole project root here as well ===
      - /home/coder:/workspace
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000 --clearScreen false"
    depends_on:
      - backend
